name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Enables "Run workflow" in the Backstage CI/CD tab.
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pip install ruff pytest
      - run: ruff check .
      - run: pytest --maxfail=1
